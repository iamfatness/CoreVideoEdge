<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 64" width="360" height="64">
  <title>CoreVideo Edge</title>
  <!-- Wordmark lockup on the window ground. The wordmark IS the font: Space Grotesk SemiBold
       (bundled in app/CoreVideoEdge.Desktop/Assets/Fonts). Mark at 1.4x cap height, 0.5x cap-height gap.
       Text is live text: install Space Grotesk to view it as designed. -->
  <rect width="360" height="64" fill="#0A0B0C"/>
  <g transform="translate(12 10) scale(0.3667)">
    <rect x="10" y="18" width="78" height="60" rx="13" fill="none" stroke="#3CC4E0" stroke-width="6"/>
    <path d="M49 18V78M10 48H88" fill="none" stroke="#3CC4E0" stroke-width="5"/>
    <rect x="62" y="60" width="50" height="38" rx="8" fill="#3CC4E0" stroke="#0A0B0C" stroke-width="6" paint-order="stroke"/>
  </g>
  <text x="66" y="33" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="22" fill="#E9EDEF">CoreVideo Edge</text>
  <text x="66" y="51" font-family="'Space Grotesk', sans-serif" font-weight="400" font-size="11" fill="#9BA4AB">Guest feeds</text>
</svg>
